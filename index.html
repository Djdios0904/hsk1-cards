<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK Cards</title>
<meta name="description" content="Spaced-repetition flashcards and audio quiz for HSK 1 and HSK 2.">
<meta name="theme-color" content="#1E7A62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<style>
/* Layout: one-column study desk — category + group pickers, a single large card, controls under it */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#16201C; --muted:#5E6E68; --line:#D3DCD8;
  --jade:#1E7A62; --jade-soft:#D9EDE6; --cinnabar:#C2412F; --cin-soft:#F7E1DD; --amber:#B7791F; --sky:#2F6FA8;
  --hz:'Noto Serif SC','Songti SC','SimSun',serif;
  --ui:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1A2420; --ink:#E7EEEB; --muted:#93A59E; --line:#2C3A35;
  --jade:#4FBF9C; --jade-soft:#1E3A31; --cinnabar:#E8705D; --cin-soft:#3A221E; --amber:#E0A84A; --sky:#6AA8E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1A2420; --ink:#E7EEEB; --muted:#93A59E; --line:#2C3A35;
  --jade:#4FBF9C; --jade-soft:#1E3A31; --cinnabar:#E8705D; --cin-soft:#3A221E; --amber:#E0A84A; --sky:#6AA8E0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--hz);font-weight:900;font-size:26px;margin:0;letter-spacing:.02em}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:800}
.stats .due b{color:var(--jade)}
.panel{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:56px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:5px 11px;cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--surface)}
button:focus-visible,.card:focus-visible,input:focus-visible,.speak:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.groups{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.groups.num{display:grid;grid-template-columns:repeat(8,1fr)}
.groups.num .chip{padding:5px 0;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat b{font-size:15px;font-weight:800}
.cat span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.cat[aria-pressed="true"] span{color:var(--ink)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}

.stage{perspective:1400px}
.card{position:relative;width:100%;aspect-ratio:4/4.4;max-height:58vh;min-height:300px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);display:block;max-width:100%}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;text-align:center;gap:10px;overflow:hidden}
.face::before,.qcard::before{content:"";position:absolute;inset:12px;border:1px solid var(--line);border-radius:11px;pointer-events:none;opacity:.6}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:22px;left:24px;font-size:12px;font-weight:600;color:var(--jade);letter-spacing:.04em;max-width:60%;text-align:left}
.tag.r{left:auto;right:24px;color:var(--muted);font-weight:400}
.emoji{font-family:var(--emoji);font-size:56px;line-height:1}
.hz{font-family:var(--hz);font-weight:900;line-height:1.05;letter-spacing:.02em;white-space:nowrap}
.py{font-size:34px;font-weight:800;color:var(--jade);line-height:1.15}
.pos{font-size:13px;font-style:italic;color:var(--muted)}
.en{font-size:21px;line-height:1.3;max-width:28ch;text-wrap:balance}
.en.big{font-size:28px;font-weight:600}
.hint{font-size:12px;color:var(--muted);position:absolute;bottom:24px}
.face.rich{gap:6px;padding:44px 20px 20px}
.face.rich .py{font-size:30px}.face.rich .en{font-size:19px}.face.rich .speak{margin-top:4px}
.cp{font-size:13px;color:var(--muted);max-width:34ch;line-height:1.4;text-wrap:balance}
.ex{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);width:100%;max-width:34ch;display:flex;flex-direction:column;gap:3px}
.exz{font-family:var(--hz);font-size:20px;line-height:1.35;font-weight:600}.exz b{color:var(--jade);font-weight:900}
.exp{font-size:13px;color:var(--jade)}.exe{font-size:13px;color:var(--muted);line-height:1.35}
.speaks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.speak{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:6px}

.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn span{font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.again{border-color:color-mix(in srgb,var(--cinnabar) 55%,var(--line));color:var(--cinnabar)}
.btn.hard{color:var(--amber)}
.btn.good,.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn.good span,.btn.primary span{color:var(--surface);opacity:.85}
.btn.easy{color:var(--sky)}
.btn.wide{grid-column:span 4;flex-direction:row;justify-content:center;padding:13px;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.done{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--hz);font-size:64px;font-weight:900;line-height:1}
.done p{margin:0;color:var(--muted);max-width:36ch;line-height:1.5}

/* quiz */
.qcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.qcard.ok{border-color:var(--jade)}
.qcard.bad{border-color:var(--cinnabar)}
.play{width:112px;height:112px;border-radius:50%;border:0;background:var(--jade);color:var(--surface);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 0 8px var(--jade-soft);transition:transform .12s}
.play:active{transform:scale(.95)}
.play svg{width:46px;height:46px}
.play.playing{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 8px var(--jade-soft)}50%{box-shadow:0 0 0 18px var(--jade-soft)}100%{box-shadow:0 0 0 8px var(--jade-soft)}}
.qprompt{font-size:14px;color:var(--muted)}
.qprompt b{color:var(--ink)}
.qform{display:flex;gap:8px;width:100%}
.qform input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.qform input.hzin{font-family:var(--hz);font-size:24px}
.qform .btn{flex-direction:row;padding:0 18px}
.verdict{font-weight:800;font-size:15px;letter-spacing:.02em}
.verdict.ok{color:var(--jade)}
.verdict.bad{color:var(--cinnabar)}
.reveal{display:flex;flex-direction:column;align-items:center;gap:4px}
.reveal .hz{font-size:56px}
.reveal .py{font-size:26px}
.reveal .en{font-size:18px}
.yours{font-size:13px;color:var(--muted)}
.yours s{color:var(--cinnabar)}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.missed{width:100%;display:flex;flex-direction:column;gap:0;text-align:left;border-top:1px solid var(--line)}
.missed div{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.missed .h{font-family:var(--hz);font-weight:900;font-size:22px;grid-row:span 2}
.missed .p{color:var(--jade);font-weight:600}
.missed .e{font-size:13px;color:var(--muted)}
.score{font-family:var(--hz);font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.qbtns{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
.qbtns .btn{flex-direction:row;padding:12px 18px;min-width:140px;justify-content:center}

footer{margin-top:auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:6px}
footer button{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
footer .warn{color:var(--cinnabar)}
.keys{display:none}
@media (hover:hover) and (pointer:fine){.keys{display:inline}}
@media (max-width:520px){.groups.num{grid-template-columns:repeat(5,1fr)}.panel>.row.grp{flex-direction:column;align-items:stretch}.py{font-size:30px}.emoji{font-size:48px}}
@media (max-width:380px){.cat{padding:8px}.cat b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.play.playing{animation:none}}
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>汉语卡片</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="cats" id="cats"></div>

  <div class="panel">
    <div class="row grp"><span class="lbl" id="grpLbl">Lessons</span><div class="groups" id="groups"></div></div>
    <div class="row">
      <span class="lbl">Mode</span>
      <div class="seg" id="mode">
        <button type="button" data-v="review">Review</button>
        <button type="button" data-v="browse">Browse</button>
        <button type="button" data-v="quiz">Audio quiz</button>
      </div>
    </div>
    <div class="row" id="cardOpts">
      <span class="lbl">Show</span>
      <div class="seg" id="dir">
        <button type="button" data-v="zh">汉字 → EN</button>
        <button type="button" data-v="en">EN → 汉字</button>
      </div>
      <button type="button" class="chip" id="autoBtn" title="Play the word automatically when the card flips">🔊 Auto-play</button>
    </div>
    <div class="row" id="quizOpts">
      <span class="lbl">Answer</span>
      <div class="seg" id="qType">
        <button type="button" data-v="en">English</button>
        <button type="button" data-v="py">Pinyin</button>
        <button type="button" data-v="hz">汉字</button>
      </div>
      <div class="seg" id="qLen">
        <button type="button" data-v="10">10</button>
        <button type="button" data-v="20">20</button>
        <button type="button" data-v="0">All</button>
      </div>
      <button type="button" class="chip" id="toneBtn" title="Require correct tones when answering in pinyin">Tones required</button>
    </div>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="meta"><span id="metaL"></span><span id="metaR"></span></div>

  <div id="studyArea">
    <div class="stage">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </div>
  <div id="doneArea" hidden></div>
  <div id="quizArea" hidden></div>

  <div id="controls"></div>

  <footer>
    <span>Progress is saved in this browser only.</span>
    <span id="resetWrap"><button type="button" id="resetBtn">Reset progress</button></span>
  </footer>
</div>

p":"二 + 儿 · a person with a big head: first, origin","ex":["这件衣服一百元。","Zhè jiàn yīfu yìbǎi yuán.","This piece of clothing costs 100 yuan."]},{"id":"hz-37","c":"hz","g":1,"hz":"九","py":"jiǔ","pos":"num.","en":"nine","em":"","cp":"picture of a bent arm","ex":["现在九点。","Xiànzài jiǔ diǎn.","It's nine o'clock now."]},{"id":"hz-38","c":"hz","g":1,"hz":"几","py":"jǐ","pos":"pron.","en":"how many; a few","em":"","cp":"picture of a small table","ex":["你家有几口人？","Nǐ jiā yǒu jǐ kǒu rén?","How many people are in your family?"]},{"id":"hz-39","c":"hz","g":1,"hz":"江","py":"jiāng","pos":"n.","en":"river (large)","em":"","cp":"氵 water + 工 gōng (sound)","ex":["长江很长。","Chángjiāng hěn cháng.","The Yangtze is very long."]},{"id":"hz-40","c":"hz","g":1,"hz":"河","py":"hé","pos":"n.","en":"river","em":"","cp":"氵 water + 可 kě (sound)","ex":["我家前面有一条河。","Wǒ jiā qiánmian yǒu yì tiáo hé.","There's a river in front of my home."]},{"id":"hz-41","c":"hz","g":1,"hz":"汁","py":"zhī","pos":"n.","en":"juice","em":"","cp":"氵 water + 十 shí (sound)","ex":["我要一杯果汁。","Wǒ yào yì bēi guǒzhī.","I'd like a glass of juice."]},{"id":"hz-42","c":"hz","g":1,"hz":"冰","py":"bīng","pos":"n.","en":"ice","em":"","cp":"冫 ice + 水 water · water turned to ice","ex":["我不喝冰水。","Wǒ bù hē bīng shuǐ.","I don't drink iced water."]},{"id":"hz-43","c":"hz","g":1,"hz":"冷","py":"lěng","pos":"adj.","en":"cold","em":"","cp":"冫 ice + 令 lìng (sound)","ex":["今天很冷。","Jīntiān hěn lěng.","It's very cold today."]},{"id":"hz-44","c":"hz","g":1,"hz":"冻","py":"dòng","pos":"v.","en":"to freeze; frozen","em":"","cp":"冫 ice + 东 dōng (sound)","ex":["水冻成冰了。","Shuǐ dòngchéng bīng le.","The water has frozen into ice."]},{"id":"hz-45","c":"hz","g":1,"hz":"品","py":"pǐn","pos":"n.","en":"product; to taste","em":"","cp":"口 + 口 + 口 · many mouths tasting","ex":["这家商店的商品很便宜。","Zhè jiā shāngdiàn de shāngpǐn hěn piányi.","The goods in this shop are cheap."]},{"id":"hz-46","c":"hz","g":1,"hz":"吃","py":"chī","pos":"v.","en":"to eat","em":"","cp":"口 mouth + 乞 qǐ (sound)","ex":["你想吃什么？","Nǐ xiǎng chī shénme?","What would you like to eat?"]},{"id":"hz-47","c":"hz","g":1,"hz":"叫","py":"jiào","pos":"v.","en":"to call; to shout","em":"","cp":"口 mouth + 丩 jiū (sound) · calling out","ex":["我叫王明。","Wǒ jiào Wáng Míng.","My name is Wang Ming."]},{"id":"hz-48","c":"hz","g":1,"hz":"早","py":"zǎo","pos":"adj.","en":"early; morning","em":"","cp":"日 sun + 十 · the sun just over the horizon","ex":["我早上六点起床。","Wǒ zǎoshang liù diǎn qǐchuáng.","I get up at six in the morning."]},{"id":"hz-49","c":"hz","g":1,"hz":"昨","py":"zuó","pos":"n.","en":"yesterday","em":"","cp":"日 day + 乍 zhà (sound) · only used inside 昨天","ex":["昨天我很忙。","Zuótiān wǒ hěn máng.","I was very busy yesterday."]},{"id":"hz-50","c":"hz","g":1,"hz":"明","py":"míng","pos":"adj.","en":"bright; clear; next","em":"","cp":"日 sun + 月 moon · sun and moon together: bright","ex":["明天见！","Míngtiān jiàn!","See you tomorrow!"]},{"id":"hz-51","c":"hz","g":1,"hz":"泪","py":"lèi","pos":"n.","en":"tear; tears","em":"","cp":"氵 water + 目 eye · water from the eye","ex":["她的眼泪下来了。","Tā de yǎnlèi xiàlai le.","Her tears started to fall."]},{"id":"hz-52","c":"hz","g":1,"hz":"眼","py":"yǎn","pos":"n.","en":"eye","em":"","cp":"目 eye + 艮 gèn (sound)","ex":["她的眼睛很漂亮。","Tā de yǎnjing hěn piàoliang.","Her eyes are beautiful."]},{"id":"hz-53","c":"hz","g":1,"hz":"木","py":"mù","pos":"n.","en":"wood; tree","em":"","cp":"picture of a tree with branches and roots","ex":["这个桌子是木头的。","Zhège zhuōzi shì mùtou de.","This table is made of wood."]},{"id":"hz-54","c":"hz","g":1,"hz":"母","py":"mǔ","pos":"n.","en":"mother","em":"","cp":"女 woman + two dots · a woman nursing: mother","ex":["她是我的母亲。","Tā shì wǒ de mǔqīn.","She is my mother."]},{"id":"hz-55","c":"hz","g":1,"hz":"目","py":"mù","pos":"n.","en":"eye","em":"","cp":"picture of an eye, turned upright","ex":["这个题目很长。","Zhège tímù hěn cháng.","This question is very long."]}];
const CATS = {
  c:  {name:'Course', sub:'Lessons 1–14', groups:[...Array(14)].map((_,i)=>String(i+1)), num:true},
  h1: {name:'HSK 1', sub:'150 words', groups:['Pronouns','Numbers & measures','Function words','Places & time','Family & people','Things','Verbs I','Verbs II','Adjectives']},
  h2: {name:'HSK 2', sub:'150 words', groups:['Pronouns & numbers','Adverbs & conjunctions','Prepositions & particles','Places & time','Family & people','Things','Verbs I','Verbs II','Adjectives']},
  hz: {name:'Hanzi', sub:'55 characters', groups:['Characters']}
};
const DAY = 864e5, NEW_PER_SESSION = 15, KEY = 'hsk1-cards-v1';

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
};
let saved = store.get();
let srs = saved.srs || {};
let settings = Object.assign({cat:'c', sel:{c:[1], h1:[1], h2:[1], hz:[1]}, mode:'review', dir:'zh', auto:false, qType:'en', qLen:'20', tones:true}, saved.settings || {});
if (settings.lessons){ settings.sel = Object.assign({c:settings.lessons, h1:[1], h2:[1]}, settings.sel||{}); settings.sel.c = settings.lessons; delete settings.lessons; }
settings.sel = Object.assign({c:[1], h1:[1], h2:[1], hz:[1]}, settings.sel);
const persist = () => store.set({srs, settings});

// ---------- scheduling ----------
function preview(id, g){
  const s = srs[id] || {iv:0, ef:2.5, reps:0};
  if (g === 0) return 0;
  if (!s.reps) return g === 1 ? 1 : g === 2 ? 2 : 4;
  const iv = Math.max(1, s.iv);
  if (g === 1) return Math.max(1, Math.round(iv * 1.2));
  if (g === 2) return Math.max(iv + 1, Math.round(iv * s.ef));
  return Math.max(iv + 2, Math.round(iv * s.ef * 1.3));
}
function grade(id, g){
  const s = srs[id] || {iv:0, ef:2.5, reps:0};
  if (g === 0){ s.ef = Math.max(1.3, s.ef - 0.2); s.iv = 0; s.reps = 0; s.due = Date.now(); s.lapse = (s.lapse||0)+1; }
  else {
    s.iv = preview(id, g);
    s.ef = Math.max(1.3, s.ef + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0));
    s.reps++;
    s.due = startOfDay(Date.now()) + s.iv * DAY;
  }
  srs[id] = s; persist();
}
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fmtIv = d => d === 0 ? 'again' : d < 30 ? d + 'd' : d < 365 ? Math.round(d/30) + 'mo' : (d/365).toFixed(1) + 'y';
const isDue = c => srs[c.id] && srs[c.id].reps > 0 && srs[c.id].due <= Date.now();
const isNew = c => !srs[c.id] || (!srs[c.id].reps && !srs[c.id].lapse);

// ---------- pools ----------
const inCat = cat => CARDS.filter(c => c.c === cat);
const pool = () => CARDS.filter(c => c.c === settings.cat && settings.sel[settings.cat].includes(c.g));
const tagFor = c => c.c === 'c' ? `第${c.g}课` : CATS[c.c].groups.length === 1 ? CATS[c.c].name : `${CATS[c.c].name} · ${CATS[c.c].groups[c.g-1]}`;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// ---------- session ----------
let queue = [], pos = 0, flipped = false, sessionDone = 0, sessionTotal = 0, againCount = 0;
function buildSession(){
  flipped = false; pos = 0; sessionDone = 0; againCount = 0;
  const p = pool();
  if (settings.mode === 'browse') queue = p.slice();
  else if (settings.mode === 'review'){
    const lapsed = p.filter(c => srs[c.id] && !srs[c.id].reps && srs[c.id].lapse);
    queue = [...lapsed, ...shuffle(p.filter(isDue)), ...p.filter(isNew).slice(0, NEW_PER_SESSION)];
  } else queue = [];
  sessionTotal = queue.length;
  if (settings.mode === 'quiz') quizSetup();
  render();
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hzLen = h => h.replace(/[^\u3400-\u9fff]/g,'').length;
const hzSize = h => ({1:128,2:104,3:80,4:64}[hzLen(h)] || 48);

function renderStats(){
  const all = inCat(settings.cat), sel = pool();
  const learned = all.filter(c => srs[c.id] && srs[c.id].reps > 0).length;
  $('stats').innerHTML = `<span class="due"><b>${sel.filter(isDue).length}</b> due</span><span><b>${sel.filter(isNew).length}</b> new</span><span><b>${learned}</b>/${all.length} learned</span>`;
}
function renderCats(){
  $('cats').innerHTML = Object.entries(CATS).map(([k,v]) => {
    const due = inCat(k).filter(isDue).length;
    return `<button type="button" class="cat" data-k="${k}" aria-pressed="${settings.cat===k}"><b>${v.name}</b><span>${due ? due + ' due' : v.sub}</span></button>`;
  }).join('');
  $('cats').querySelectorAll('.cat').forEach(b => b.onclick = () => { settings.cat = b.dataset.k; persist(); renderCats(); renderGroups(); buildSession(); });
}
function renderGroups(){
  const cat = CATS[settings.cat], el = $('groups'), sel = settings.sel[settings.cat];
  document.querySelector('.row.grp').hidden = cat.groups.length === 1;
  $('grpLbl').textContent = cat.num ? 'Lessons' : 'Groups';
  el.className = 'groups' + (cat.num ? ' num' : '');
  el.innerHTML = '';
  const n = cat.groups.length, allOn = sel.length === n;
  const mk = (txt, on, fn, title) => { const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=txt; b.setAttribute('aria-pressed', on); if(title) b.title=title; b.onclick=fn; el.appendChild(b); };
  cat.groups.forEach((label, i) => {
    const g = i + 1, cnt = CARDS.filter(c => c.c === settings.cat && c.g === g).length;
    mk(label, sel.includes(g), () => {
      const s = new Set(sel); s.has(g) ? s.delete(g) : s.add(g); if (!s.size) s.add(g);
      settings.sel[settings.cat] = [...s].sort((a,b)=>a-b); persist(); renderGroups(); buildSession();
    }, `${cnt} words`);
  });
  mk('All', allOn, () => { settings.sel[settings.cat] = allOn ? [1] : cat.groups.map((_,i)=>i+1); persist(); renderGroups(); buildSession(); });
}
function setSeg(id, key, after){
  [...$(id).children].forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v) === String(settings[key]));
    b.onclick = () => { settings[key] = b.dataset.v; persist(); setSeg(id, key, after); after(); };
  });
}

// ---------- card faces ----------
const speakBtn = c => (c && c.ex)
  ? `<div class="speaks"><span class="speak" role="button" tabindex="0" data-speak>🔊 Word <span class="keys">· S</span></span><span class="speak" role="button" tabindex="0" data-speak="s">🔊 Sentence</span></div>`
  : `<span class="speak" role="button" tabindex="0" data-speak>🔊 Hear it <span class="keys">· S</span></span>`;
const emo = c => c.em ? `<div class="emoji">${c.em}</div>` : '';
const extras = c => (c.cp ? `<div class="cp">${esc(c.cp)}</div>` : '') + (c.ex ? `<div class="ex"><div class="exz">${esc(c.ex[0]).split(esc(c.hz)).join('<b>'+esc(c.hz)+'</b>')}</div><div class="exp">${esc(c.ex[1])}</div><div class="exe">${esc(c.ex[2])}</div></div>` : '');
function faceZh(c){ return `<span class="tag">${esc(tagFor(c))}</span>${emo(c)}<div class="hz" style="font-size:${hzSize(c.hz)}px">${esc(c.hz)}</div><span class="hint">Tap or press Space to flip</span>`; }
function faceEn(c){ return `<span class="tag">${esc(tagFor(c))}</span>${emo(c)}${c.pos?`<div class="pos">${esc(c.pos)}</div>`:''}<div class="en big">${esc(c.en)}</div><span class="hint">Say it in Chinese, then flip</span>`; }
function answerZh(c){ return `<span class="tag">${esc(tagFor(c))}</span><span class="tag r">${esc(c.hz)}</span><div class="py">${esc(c.py)}</div>${c.pos?`<div class="pos">${esc(c.pos)}</div>`:''}<div class="en">${esc(c.en)}</div>${extras(c)}${speakBtn(c)}`; }
function answerEn(c){ return `<span class="tag">${esc(tagFor(c))}</span><div class="hz" style="font-size:${Math.round(hzSize(c.hz)*.8)}px">${esc(c.hz)}</div><div class="py">${esc(c.py)}</div><div class="en">${esc(c.en)}</div>${extras(c)}${speakBtn(c)}`; }

// ---------- render ----------
function render(){
  renderStats();
  const quiz = settings.mode === 'quiz';
  $('cardOpts').hidden = quiz; $('quizOpts').hidden = !quiz;
  $('toneBtn').hidden = settings.qType !== 'py';
  if (quiz){ $('studyArea').hidden = true; $('doneArea').hidden = true; $('controls').innerHTML = ''; $('quizArea').hidden = false; renderQuiz(); return; }
  $('quizArea').hidden = true;

  const remaining = queue.length - pos;
  const finished = settings.mode === 'review' && remaining <= 0;
  $('studyArea').hidden = finished || !queue.length;
  $('doneArea').hidden = !(finished || !queue.length);
  const pct = settings.mode === 'browse' ? (queue.length ? (pos+1)/queue.length : 0) : (sessionTotal ? sessionDone/(sessionDone + Math.max(remaining,0)) : 1);
  $('bar').style.width = (pct*100).toFixed(1) + '%';

  if (!queue.length || finished){ renderDone(); $('controls').innerHTML=''; $('metaL').textContent=''; $('metaR').textContent=''; return; }

  const c = queue[pos];
  $('card').classList.toggle('flip', flipped);
  const zh = settings.dir === 'zh';
  $('front').innerHTML = zh ? faceZh(c) : faceEn(c);
  $('back').innerHTML = zh ? answerZh(c) : answerEn(c);
  $('back').classList.toggle('rich', !!c.ex);

  if (settings.mode === 'browse'){
    $('metaL').textContent = `Card ${pos+1} of ${queue.length}`;
    $('metaR').textContent = srs[c.id]?.reps ? `next review in ${Math.max(0,Math.ceil((srs[c.id].due-Date.now())/DAY))}d` : 'not studied yet';
    $('controls').innerHTML = `<div class="nav">
      <button class="btn" type="button" id="prev" ${pos===0?'disabled':''}>← Prev</button>
      <button class="btn" type="button" id="flipB">${flipped?'Show front':'Flip'}</button>
      <button class="btn" type="button" id="next" ${pos>=queue.length-1?'disabled':''}>Next →</button></div>`;
    $('prev').onclick = () => go(-1); $('next').onclick = () => go(1); $('flipB').onclick = flip;
  } else {
    $('metaL').textContent = isNew(c) ? 'New card' : (srs[c.id]?.lapse && !srs[c.id].reps ? 'Relearning' : 'Review');
    $('metaR').textContent = `${remaining} left in session`;
    if (!flipped){
      $('controls').innerHTML = `<div class="grade"><button class="btn good wide" type="button" id="show">Show answer <span class="keys">· Space</span></button></div>`;
      $('show').onclick = flip;
    } else {
      const lab = ['Again','Hard','Good','Easy'], cls = ['again','hard','good','easy'];
      $('controls').innerHTML = `<div class="grade">${lab.map((t,g)=>`<button class="btn ${cls[g]}" type="button" data-g="${g}">${t}<span>${fmtIv(preview(c.id,g))}<span class="keys"> · ${g+1}</span></span></button>`).join('')}</div>`;
      $('controls').querySelectorAll('[data-g]').forEach(b => b.onclick = () => answer(+b.dataset.g));
    }
  }
}
function renderDone(){
  const p = pool();
  const nextDue = p.filter(c=>srs[c.id]?.reps).map(c=>srs[c.id].due).sort((a,b)=>a-b)[0];
  const moreNew = p.filter(isNew).length;
  const msg = (sessionTotal && sessionDone) ? `${sessionDone} cards reviewed${againCount?`, ${againCount} missed and re-drilled`:''}.` : 'Nothing is due in the selected groups right now.';
  const when = nextDue ? `Next card is due ${nextDue <= Date.now() ? 'now' : new Date(nextDue).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}.` : '';
  $('doneArea').innerHTML = `<div class="done"><div class="big">好！</div><p>${msg} ${when}</p>
    ${moreNew ? `<button class="btn good wide" type="button" id="more" style="max-width:280px">Learn ${Math.min(NEW_PER_SESSION, moreNew)} more new words</button>` : `<p>Every word in these groups has been started. Add another group above to keep going.</p>`}</div>`;
  if (moreNew) $('more').onclick = () => { queue = p.filter(isNew).slice(0, NEW_PER_SESSION); pos=0; sessionTotal=queue.length; sessionDone=0; againCount=0; flipped=false; render(); };
}

function flip(){ flipped = !flipped; render(); if (flipped && settings.auto) speak(queue[pos]); }
function go(d){ pos = Math.min(queue.length-1, Math.max(0, pos+d)); flipped=false; render(); }
function answer(g){
  const c = queue[pos];
  grade(c.id, g);
  if (g === 0){ againCount++; queue.splice(Math.min(queue.length, pos + 4), 0, c); }
  else sessionDone++;
  pos++; flipped = false; renderCats(); render();
}

// ---------- audio ----------
const player = new Audio(); player.preload = 'auto';
let playBtnRef = null;
function deviceSpeak(c){
  try{
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /zh[-_]CN/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c.hz); u.lang = v ? v.lang : 'zh-CN'; if (v) u.voice = v; u.rate = .8;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakSentence(c){
  if (!c || !c.ex) return;
  try{ player.pause(); player.src = 'audio/' + c.id + '-s.mp3'; player.currentTime = 0;
    player.onerror = () => deviceSpeak({hz:c.ex[0]}); const pr = player.play(); if (pr && pr.catch) pr.catch(() => deviceSpeak({hz:c.ex[0]})); }catch(e){ deviceSpeak({hz:c.ex[0]}); }
}
function speak(c){
  if (!c) return;
  const pb = $('playBtn'); if (pb){ pb.classList.remove('playing'); void pb.offsetWidth; pb.classList.add('playing'); }
  try{
    player.pause(); player.src = 'audio/' + c.id + '.mp3'; player.currentTime = 0;
    player.onerror = () => deviceSpeak(c);
    const pr = player.play(); if (pr && pr.catch) pr.catch(() => deviceSpeak(c));
  }catch(e){ deviceSpeak(c); }
}

// ---------- quiz ----------
let qz = {phase:'setup', list:[], i:0, res:[], answered:false};
const quizEligible = () => pool().filter(c => c.pos !== 'part.' && c.pos !== 'suf.' && !(settings.qType === 'en' && /measure word|particle/.test(c.en)));
function quizSetup(){ qz = {phase:'setup', list:[], i:0, res:[], answered:false}; }
function quizStart(list){
  const n = +settings.qLen;
  qz = {phase:'q', list: list || shuffle(quizEligible().slice()).slice(0, n || undefined), i:0, res:[], answered:false};
  render(); speak(qz.list[0]); focusInput();
}
const focusInput = () => setTimeout(() => { const i = $('qIn'); if (i) i.focus(); }, 30);
const TYPE = {en:{word:'English meaning', ph:'Type the English meaning'}, py:{word:'pinyin', ph:'e.g. ni3hao3 or nǐhǎo'}, hz:{word:'characters', ph:'Type 汉字 (Chinese keyboard)'}};

function renderQuiz(){
  const A = $('quizArea'), total = qz.list.length;
  if (qz.phase === 'setup'){
    const n = quizEligible().length, len = +settings.qLen ? Math.min(+settings.qLen, n) : n;
    $('bar').style.width = '0%'; $('metaL').textContent = `${n} words available in this selection`; $('metaR').textContent = '';
    A.innerHTML = `<div class="qcard">
      <div class="play" aria-hidden="true" style="cursor:default">${playIcon}</div>
      <p class="qprompt">You hear a word. No text, no picture.<br>Type its <b>${TYPE[settings.qType].word}</b>.</p>
      ${settings.qType==='hz' ? `<p class="qprompt">Needs a Chinese (pinyin) keyboard on your device.</p>` : ''}
      ${settings.qType==='py' ? `<p class="qprompt">Tones as marks (nǐ) or numbers (ni3). ${settings.tones ? 'Tones are checked.' : 'Tones are ignored.'}</p>` : ''}
      <button class="btn primary wide" type="button" id="qGo" ${n?'':'disabled'} style="max-width:280px">Start ${len}-word quiz</button>
      ${n ? '' : '<p class="qprompt">No quizzable words here. Particles are left out of the audio quiz. Pick another group.</p>'}</div>`;
    if (n) $('qGo').onclick = () => quizStart();
    return;
  }
  if (qz.phase === 'done'){
    const ok = qz.res.filter(r=>r.ok).length, miss = qz.res.filter(r=>!r.ok);
    $('bar').style.width = '100%'; $('metaL').textContent = 'Quiz finished'; $('metaR').textContent = '';
    A.innerHTML = `<div class="qcard"><div class="score">${ok}/${total}</div>
      <p class="qprompt">${miss.length ? `${miss.length} missed. Drill them again before a new set.` : 'Clean sheet.'}</p>
      ${miss.length ? `<div class="missed">${miss.map(r=>`<div><span class="h">${esc(r.c.hz)}</span><span class="p">${esc(r.c.py)}</span><span class="e">${esc(r.c.en)}${r.input?` · you typed “${esc(r.input)}”`:''}</span></div>`).join('')}</div>` : ''}
      <div class="qbtns">${miss.length ? `<button class="btn primary" type="button" id="qRetry">Retry ${miss.length} missed</button>` : ''}<button class="btn" type="button" id="qNew">New quiz</button></div></div>`;
    if (miss.length) $('qRetry').onclick = () => quizStart(shuffle(miss.map(r=>r.c)));
    $('qNew').onclick = () => { quizSetup(); render(); };
    return;
  }
  const c = qz.list[qz.i], r = qz.res[qz.i];
  const ok = qz.res.filter(x=>x.ok).length;
  $('bar').style.width = ((qz.i + (qz.answered?1:0)) / total * 100).toFixed(1) + '%';
  $('metaL').textContent = `Word ${qz.i+1} of ${total}`; $('metaR').textContent = `${ok} correct`;
  const t = settings.qType;
  A.innerHTML = `<div class="qcard ${qz.answered ? (r.ok?'ok':'bad') : ''}">
    <button class="play" type="button" id="playBtn" aria-label="Play the word again">${playIcon}</button>
    ${qz.answered ? `
      <div class="verdict ${r.ok?'ok':'bad'}">${r.ok ? (r.close ? 'Correct (tones ignored)' : 'Correct') : 'Not quite'}</div>
      <div class="reveal"><div class="hz" style="font-size:${Math.min(56, hzSize(c.hz)*.55)}px">${esc(c.hz)}</div><div class="py">${esc(c.py)}</div><div class="en">${esc(c.en)}</div></div>
      ${!r.ok ? `<div class="yours">You typed: <s>${r.input ? esc(r.input) : '(nothing)'}</s></div>` : ''}
      <div class="qbtns"><button class="btn primary" type="button" id="qNext">${qz.i+1 < total ? 'Next word' : 'See results'} <span class="keys">· Enter</span></button></div>
      ${!r.ok && r.input && t !== 'hz' ? `<button class="linkbtn" type="button" id="qOverride">My answer was right, count it</button>` : ''}
    ` : `
      <p class="qprompt">Type the <b>${TYPE[t].word}</b></p>
      <form class="qform" id="qForm" autocomplete="off">
        <input id="qIn" class="${t==='hz'?'hzin':''}" placeholder="${TYPE[t].ph}" autocapitalize="off" autocorrect="off" spellcheck="false" ${t==='hz'?'lang="zh-CN"':''} aria-label="Your answer">
        <button class="btn primary" type="submit">Check</button>
      </form>
      <button class="linkbtn" type="button" id="qSkip">I don't know, show me</button>`}
  </div>`;
  $('playBtn').onclick = () => { speak(c); if (!qz.answered) focusInput(); };
  if (qz.answered){
    $('qNext').onclick = quizNext; setTimeout(() => $('qNext') && $('qNext').focus(), 30);
    if ($('qOverride')) $('qOverride').onclick = () => { r.ok = true; r.override = true; renderQuiz(); };
  } else {
    $('qForm').onsubmit = e => { e.preventDefault(); quizCheck($('qIn').value); };
    $('qSkip').onclick = () => quizCheck('');
  }
}
function quizCheck(input){
  const c = qz.list[qz.i], v = input.trim();
  let ok = false, close = false;
  if (v){
    if (settings.qType === 'hz') ok = checkHz(v, c);
    else if (settings.qType === 'en') ok = checkEn(v, c);
    else { const s = checkPy(v, c); ok = s.ok; close = s.close; }
  }
  qz.res[qz.i] = {c, ok, close, input: v};
  qz.answered = true; renderQuiz();
}
function quizNext(){
  if (qz.i + 1 >= qz.list.length){ qz.phase = 'done'; renderQuiz(); return; }
  qz.i++; qz.answered = false; renderQuiz(); speak(qz.list[qz.i]); focusInput();
}
const playIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;

// ---------- answer checking ----------
const onlyHz = s => s.replace(/[^\u3400-\u9fff]/g, '');
function checkHz(v, c){ return onlyHz(v) && onlyHz(v) === onlyHz(c.hz); }

const TONES = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
function markSyl(s, t){
  if (!(t >= 1 && t <= 4)) return s;
  let idx = s.indexOf('a'); if (idx < 0) idx = s.indexOf('e');
  if (idx < 0 && s.includes('ou')) idx = s.indexOf('o');
  if (idx < 0){ for (let k = s.length-1; k >= 0; k--) if ('aeiouü'.includes(s[k])){ idx = k; break; } }
  if (idx < 0) return s;
  return s.slice(0, idx) + TONES[s[idx]][t-1] + s.slice(idx+1);
}
function pyNorm(s){
  s = s.normalize('NFC').toLowerCase().replace(/u:/g,'ü').replace(/v/g,'ü');
  s = s.replace(/([a-zü]+)([0-5])/g, (_, syl, t) => markSyl(syl, +t));
  return s.replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, '');
}
const stripTones = s => s.normalize('NFD').replace(/[\u0300\u0301\u0304\u030C]/g, '').normalize('NFC');
function sandhi(s, c){
  if (c.hz.includes('一')) s = s.replace(/y[īíì]/g, 'yī');
  if (c.hz.includes('不')) s = s.replace(/b[úù]/g, 'bù');
  return s;
}
function checkPy(v, c){
  const inp = sandhi(pyNorm(v), c);
  const opts = c.py.split('/').map(o => sandhi(pyNorm(o), c));
  if (opts.includes(inp)) return {ok:true};
  if (opts.map(stripTones).includes(stripTones(inp))) return settings.tones ? {ok:false} : {ok:true, close:true};
  return {ok:false};
}
function enNorm(s){
  return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()
    .replace(/^(to be |to |a |an |the )/,'').trim();
}
function enOptions(en){
  const out = new Set();
  en.split(/[;,/]/).forEach(part => {
    const p = part.replace(/["“”]/g,'');
    [p.replace(/\([^)]*\)/g,''), p.replace(/[()]/g,'')].forEach(x => { const n = enNorm(x); if (n) out.add(n); });
  });
  return [...out];
}
function lev(a, b){
  const m = a.length, n = b.length; if (Math.abs(m-n) > 2) return 9;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
function checkEn(v, c){
  const inp = enNorm(v); if (!inp) return false;
  return enOptions(c.en).some(o => o === inp || (inp.length >= 5 && lev(o, inp) <= 1) || (inp.length >= 9 && lev(o, inp) <= 2));
}

// ---------- events ----------
document.addEventListener('click', e => {
  const sp = e.target.closest('[data-speak]');
  if (sp){ e.stopPropagation(); sp.dataset.speak === 's' ? speakSentence(queue[pos]) : speak(queue[pos]); }
}, true);
$('card').addEventListener('click', flip);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (settings.mode === 'quiz') return;
  if (!queue.length || $('studyArea').hidden) return;
  if (e.code === 'Space' || e.key === 'Enter'){ if (e.target.tagName === 'BUTTON') return; e.preventDefault(); flip(); }
  else if (settings.mode === 'review' && flipped && '1234'.includes(e.key)) answer(+e.key - 1);
  else if (settings.mode === 'browse' && e.key === 'ArrowRight') go(1);
  else if (settings.mode === 'browse' && e.key === 'ArrowLeft') go(-1);
  else if (e.key === 's' || e.key === 'S') speak(queue[pos]);
});
let tx = null;
$('card').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('card').addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) >= 60 && settings.mode === 'browse') go(dx < 0 ? 1 : -1);
});

function bindReset(){
  $('resetBtn').onclick = () => {
    $('resetWrap').innerHTML = `<span class="warn">Erase all progress?</span> <button type="button" id="yes">Erase</button> · <button type="button" id="no">Keep</button>`;
    $('yes').onclick = () => { srs = {}; persist(); restoreReset(); renderCats(); buildSession(); };
    $('no').onclick = restoreReset;
  };
}
function restoreReset(){ $('resetWrap').innerHTML = `<button type="button" id="resetBtn">Reset progress</button>`; bindReset(); }
bindReset();

const togg = (id, key, label) => { const b = $(id); b.setAttribute('aria-pressed', !!settings[key]); b.onclick = () => { settings[key] = !settings[key]; persist(); b.setAttribute('aria-pressed', settings[key]); if (key === 'tones' && settings.mode === 'quiz' && qz.phase === 'setup') renderQuiz(); }; };
togg('autoBtn', 'auto'); togg('toneBtn', 'tones');
setSeg('mode', 'mode', buildSession);
setSeg('dir', 'dir', render);
setSeg('qType', 'qType', () => { quizSetup(); render(); });
setSeg('qLen', 'qLen', () => { quizSetup(); render(); });
renderCats(); renderGroups(); buildSession();
if ('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body></html>
